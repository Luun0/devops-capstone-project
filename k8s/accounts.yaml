apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
spec:
  replicas: 2
  selector:
    matchLabels: {app: accounts}
  template:
    metadata:
      labels: {app: accounts}
    spec:
      containers:
        - name: accounts
          image: accounts:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: accounts-db
                  key: uri
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: accounts
spec:
  selector: {app: accounts}
  ports:
    - port: 8080
      targetPort: 8080
