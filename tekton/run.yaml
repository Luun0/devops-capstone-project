apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: accounts-cd-
spec:
  pipelineRef: {name: cd-pipeline}
  params:
    - name: repo-url
      value: https://github.com/Luun0/devops-capstone-project.git
  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 2Gi}
