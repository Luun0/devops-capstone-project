apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  params:
    - name: repo-url
    - name: revision
      default: main
    - name: image
      default: registry:5000/accounts:capstone
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef: {name: clone-source}
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces: [{name: source, workspace: source}]
    - name: test
      runAfter: [clone]
      taskRef: {name: lint-and-test}
      workspaces: [{name: source, workspace: source}]
    - name: build
      runAfter: [test]
      taskRef: {name: build-image}
      params: [{name: image, value: $(params.image)}]
      workspaces: [{name: source, workspace: source}]
    - name: deploy
      runAfter: [build]
      taskRef: {name: deploy-accounts}
      params: [{name: image, value: $(params.image)}]
      workspaces: [{name: source, workspace: source}]
