[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
cover-min-percentage=95

[coverage:report]
show_missing=True
fail_under=95

[flake8]
max-line-length=100
per-file-ignores=
    */__init__.py:F401,E402

[pylint.'MESSAGES CONTROL']
disable=E1101,C0103,R0903,W0621

[pylint.format]
max-line-length=100
