apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone-source
spec:
  params:
    - name: repo-url
    - name: revision
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.47.2
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        git clone --depth 1 --branch "$(params.revision)" "$(params.repo-url)" repo
        git -C repo log -1 --oneline
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lint-and-test
spec:
  workspaces:
    - name: source
  steps:
    - name: dependencies
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/repo
      script: |
        #!/bin/sh
        set -eu
        pip install --target /workspace/source/deps -r requirements.txt
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: PYTHONPATH
          value: /workspace/source/deps
      script: |
        #!/bin/sh
        set -eu
        python -m flake8 service tests
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: PYTHONPATH
          value: /workspace/source/deps
        - name: DATABASE_URI
          value: sqlite:////tmp/test.db
      script: |
        #!/bin/sh
        set -eu
        python /workspace/source/deps/bin/nosetests
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
spec:
  params:
    - name: image
  workspaces:
    - name: source
  sidecars:
    - name: docker
      image: docker:27-dind
      securityContext:
        privileged: true
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
      args: ["--insecure-registry=registry:5000"]
  steps:
    - name: build-and-push
      image: docker:27-cli
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375
      script: |
        #!/bin/sh
        set -eu
        until docker info >/dev/null 2>&1; do sleep 2; done
        docker build -t "$(params.image)" .
        docker push "$(params.image)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-accounts
spec:
  params:
    - name: image
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: registry.k8s.io/kubectl:v1.34.1
      workingDir: $(workspaces.source.path)/repo
      script: |
        #!/bin/sh
        set -eu
        kubectl apply -f k8s/accounts.yaml
        kubectl set image deployment/accounts accounts="$(params.image)"
        kubectl rollout status deployment/accounts --timeout=180s
        kubectl get deployment,pods,replicaset,service -l app=accounts
